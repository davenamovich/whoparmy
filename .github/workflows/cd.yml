name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Verify Whop config (informational)
        run: |
          echo "📦 Whop configuration check:"
          echo "  WHOP_APP_ID configured: $( [ -n \"${WHOP_APP_ID:-}\" ] && echo 'YES' || echo 'NO' )"
          echo "  WHOP_API_KEY configured: $( [ -n \"${WHOP_API_KEY:-}\" ] && echo 'YES' || echo 'NO' )"
          echo "  WHOP_WEBHOOK_SECRET configured: $( [ -n \"${WHOP_WEBHOOK_SECRET:-}\" ] && echo 'YES' || echo 'NO' )"

      - name: Build Next.js
        run: bun run build || true

      - name: Deploy to Vercel
        if: env_VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ env.VERCEL_TOKEN }}
          vercel-org-id: ${{ env.VERCEL_ORG_ID }}
          vercel-project-id: ${{ env.VERCEL_PROJECT_ID }}
          working-directory: .
          alias-domains: |
            - whopparmy.vercel.app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy guidance
        if: env_VERCEL_TOKEN == ''
        run: |
          echo "🚀 To enable automatic Vercel deployment:"
          echo "1. Add these secrets in GitHub → Settings → Secrets and variables → Actions:"
          echo "   - VERCEL_TOKEN"
          echo "   - VERCEL_ORG_ID"
          echo "   - VERCEL_PROJECT_ID"
          echo ""
          echo "2. The workflow will then deploy on every push to main."
          echo ""
          echo "📝 Whop env vars (optional for now - add when Whop app is ready):"
          echo "   WHOP_APP_ID, WHOP_API_KEY, WHOP_WEBHOOK_SECRET, WHOP_API_ENV"
          echo "   WHOP_PRODUCT_ID_*, WHOP_CHECKOUT_URL_*"