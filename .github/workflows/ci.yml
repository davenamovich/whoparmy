name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run lint
        run: bun run lint || true

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Run Next.js build
        run: bun run build

      - name: Prisma generate
        if: always()
        run: bun run db:generate

      - name: Prisma push
        if: always()
        # Scratch SQLite file: db push must prove the schema applies
        # cleanly end to end, but CI has (and should have) no real
        # DATABASE_URL — without one the step dies on P1012 before
        # validating anything.
        env:
          DATABASE_URL: file:./ci-scratch.db
        run: bun run db:push

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/