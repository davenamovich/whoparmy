/* ── State ── */
const state={lang:localStorage.getItem(langKey)||'en',phase:'welcome',tiles:[],assignments:[],opened:{},playerCase:null,roundIdx:0,toOpen:0,banked:0,perks:[],pendingOffer:null,offersMade:0,result:null,modal:null,modalData:null,sessionId:null,commitmentHash:'',hostLine:'',error:''};
function t(){return STR[state.lang]||STR.en}
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildBoard(){const tiles=VT_VALUES.map(v=>({type:'vt',vt:v})).concat(BOOST_KINDS.map(k=>({type:'boost',kind:k,vt:0})));return shuffle(tiles)}
function prizeLabel(p){const s=t();return p.type==='boost'?s.boostTag+' · '+s['boost_'+p.kind]:p.vt+' '+s.vt}
function prizeKey(p){return p.type==='boost'?'b:'+p.kind:'v:'+p.vt}
function quotaFor(roundIdx){return roundIdx<QUOTAS.length?QUOTAS[roundIdx]:1}
function unopenedOthers(){let n=0;for(let i=0;i<26;i++){if(i!==state.playerCase&&!state.opened[i])n++}return n}
function unopenedAll(){let n=0;for(let i=0;i<26;i++){if(!state.opened[i])n++}return n}
function lastOtherSlot(){for(let i=0;i<26;i++){if(i!==state.playerCase&&!state.opened[i])return i}return state.playerCase}
function prizeFromBoard(board,slot){const e=(board||[]).find(b=>b.slot===slot);return e?{type:e.type,vt:e.vt,kind:e.kind}:null}
function save(){try{sessionStorage.setItem(sessionKey,JSON.stringify({v:2,phase:state.phase,tiles:state.tiles,assignments:state.assignments,opened:state.opened,playerCase:state.playerCase,roundIdx:state.roundIdx,toOpen:state.toOpen,banked:state.banked,perks:state.perks,pendingOffer:state.pendingOffer,offersMade:state.offersMade,result:state.result,sessionId:state.sessionId,commitmentHash:state.commitmentHash,hostLine:state.hostLine}))}catch(_){}}
function restore(){try{const x=JSON.parse(sessionStorage.getItem(sessionKey)||'null');if(x&&x.v===2&&x.tiles&&x.tiles.length===26&&x.phase&&x.phase!=='welcome'){Object.assign(state,x);if(state.phase==='banker'){state.modal='banker'}if(state.phase==='swap'){state.modal='swap'}return true}}catch(_){sessionStorage.removeItem(sessionKey)}return false}
function clearSave(){sessionStorage.removeItem(sessionKey)}
/* ── WebAudio (created only after a gesture; mute persisted) ── */
let audio=null,previousFocus=null;
function muted(){return localStorage.getItem(mutedKey)==='1'}
function ensureAudio(){try{if(!audio){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=new C(),gain=ctx.createGain();gain.gain.value=muted()?0:.07;gain.connect(ctx.destination);audio={ctx,gain}}audio.ctx.resume()}catch(_){}}
function tone(freq,dur,delay=0,type='sine',vol=1){try{if(!audio)return;const o=audio.ctx.createOscillator(),g=audio.ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.ctx.currentTime+delay);g.gain.setValueAtTime(0,audio.ctx.currentTime+delay);g.gain.linearRampToValueAtTime(.5*vol,audio.ctx.currentTime+delay+.01);g.gain.exponentialRampToValueAtTime(.001,audio.ctx.currentTime+delay+dur);o.connect(g);g.connect(audio.gain);o.start(audio.ctx.currentTime+delay);o.stop(audio.ctx.currentTime+delay+dur+.02)}catch(_){}}
function ring(){ensureAudio();tone(740,.14,0,'sine',.7);tone(920,.14,.16,'sine',.7);tone(740,.14,.34,'sine',.7);tone(920,.18,.5,'sine',.7)}
function clickSound(){ensureAudio();tone(330,.05,0,'square',.35)}
function revealSound(p){ensureAudio();if(p.type==='boost'){[660,880,1100].forEach((f,i)=>tone(f,.13,i*.09,'triangle'))}else if(p.vt>=150){[420,560,720,980].forEach((f,i)=>tone(f,.2,i*.12,'triangle',1.1))}else if(p.vt>=50){[520,660,820].forEach((f,i)=>tone(f,.12,i*.1,'triangle'))}else{tone(500,.1);tone(620,.12,.1)}}
function offerSound(){ensureAudio();tone(180,.28,0,'sine',1);tone(125,.38,.22,'sine',1)}
function toggleMute(){localStorage.setItem(mutedKey,muted()?'0':'1');if(audio)audio.gain.gain.value=muted()?0:.07;syncTopbar()}
/* ── API adapter ────────────────────────────────────────────────────
   LIVE: POST {session,pick,decide,finish} under /api/doors/btcgame
   against GAME_API — the server is authoritative (see header note).
   The Demo mirrors the same semantics locally and mints NOTHING. */
async function apiCall(path,body){const r=await fetch(CONFIG.GAME_API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json().catch(()=>({error:'bad_response'}));if(!r.ok){const e=new Error(data.error||'request_failed');e.code=data.error;throw e}return data}
const Demo={
 opens:0,
 newSession(){state.assignments=buildBoard();state.tiles=state.assignments.map(p=>({type:p.type,vt:p.vt,kind:p.kind||null}));state.opened={};state.banked=0;state.perks=[];state.pendingOffer=null;this.opens=0;return {sessionId:'demo-'+Date.now(),caseCount:26}},
 pick(slot){const prize=state.assignments[slot];state.opened[slot]=prize;state.banked+=prize.vt;if(prize.type==='boost')state.perks.push({kind:prize.kind,slot});this.opens++;const m=OFFER_AT[this.opens];const offer=m?{index:Object.keys(OFFER_AT).indexOf(String(this.opens)),afterOpens:this.opens,gens:m.gens,tokensValue:m.gens*TOKENS_PER_GEN}:null;state.pendingOffer=offer;return {slot,prize:{type:prize.type,vt:prize.vt,kind:prize.kind||null},bankedTokens:state.banked,perks:state.perks,offer}},
 decide(take){if(!take)return {decision:'keep_playing'};const vt=Math.max(state.banked,state.pendingOffer?state.pendingOffer.tokensValue:0);return {outcome:'deal',vt,gens:Math.floor(vt/TOKENS_PER_GEN),claimUrl:null,casePrize:state.assignments[state.playerCase],perks:state.perks,finalCase:state.playerCase}},
 finish(swapped){const idx=swapped?lastOtherSlot():state.playerCase;const prize=state.assignments[idx];return {outcome:'case',vt:state.banked,gens:Math.floor(state.banked/TOKENS_PER_GEN),claimUrl:null,casePrize:prize,perks:state.perks,swapped:!!swapped,finalCase:idx}}
};
const GameAPI={
 async session(){return CONFIG.API_LIVE?apiCall('/api/doors/btcgame/session',{}):Demo.newSession()},
 async pick(slot){return CONFIG.API_LIVE?apiCall('/api/doors/btcgame/pick',{sessionId:state.sessionId,slot}):Demo.pick(slot)},
 async decide(take){if(!CONFIG.API_LIVE)return Demo.decide(take);const res=await apiCall('/api/doors/btcgame/decide',{sessionId:state.sessionId,take});if(!take)return res;const f=res.finished;return {outcome:'deal',vt:f.finalTokens,gens:f.gensAwarded,claimUrl:f.claimUrl,casePrize:prizeFromBoard(f.board,state.playerCase),perks:f.perks||[],finalCase:state.playerCase}},
 async finish(swapped){if(!CONFIG.API_LIVE)return Demo.finish(swapped);const f=await apiCall('/api/doors/btcgame/finish',{sessionId:state.sessionId});const idx=swapped?lastOtherSlot():state.playerCase;return {outcome:'case',vt:f.finalTokens,gens:f.gensAwarded,claimUrl:f.claimUrl,casePrize:prizeFromBoard(f.board,idx),perks:f.perks||[],swapped:!!swapped,finalCase:idx}}
};
function ctaHref(){const ref=new URLSearchParams(location.search).get('ref');return WHOP_BASE+'bridge?ref='+encodeURIComponent(ref||'btcgame')}
function pickLine(arr){return arr[Math.floor(Math.random()*arr.length)]}
function chipHtml(){return CONFIG.API_LIVE?'':'<span class="demochip">'+esc(t().demoChip)+'</span>'}

function renderWelcome(){const s=t();$('#screen').innerHTML=headerHtml()+'<section class="card"><div class="host"><div class="avatar">J</div><div><strong>'+esc(s.hostName)+'</strong><p>'+esc(s.hostWelcome)+'</p></div></div><div class="conversion">'+esc(s.conversion)+'</div><h3 style="margin:18px 0 0;color:var(--orange2)">'+esc(s.pointsTitle)+'</h3><ol class="steps">'+s.points.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol><div style="text-align:center">'+chipHtml()+'</div><h3 style="margin:18px 0 0;color:var(--orange2)">'+esc(s.howTitle)+'</h3><ol class="steps">'+s.how.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol><p class="note">'+esc(s.offersNote)+'</p><p class="note">'+esc(s.sub)+'</p>'+(state.error?'<div class="error" role="alert">'+esc(state.error)+'</div>':'')+'<button id="start" class="primary" style="margin-top:16px">'+esc(s.play)+'</button></section>';
$('#start').addEventListener('click',startGame)}
function boardRowsHtml(){const s=t();const rows=state.tiles.map(p=>({p})).sort((a,b)=>(a.p.vt-b.p.vt)||(a.p.type<b.p.type?-1:1));const openedCounts={};Object.values(state.opened).forEach(p=>{const k=prizeKey(p);openedCounts[k]=(openedCounts[k]||0)+1});const used={};const caseKey=state.result&&state.result.casePrize?prizeKey(state.result.casePrize):null;let mineMarked=false;return '<ul>'+rows.map(({p})=>{const key=prizeKey(p);let cls=p.type==='boost'?'boost':'';const n=used[key]||0;if(n<(openedCounts[key]||0)){cls+=' struck';used[key]=n+1}else if(caseKey&&key===caseKey&&state.phase==='result'&&!mineMarked){cls+=' minehit';mineMarked=true}return '<li class="'+cls.trim()+'"><span>'+(p.type==='boost'?esc(s['boost_'+p.kind]):p.vt)+'</span><span class="u">'+(p.type==='boost'?esc(s.boostTag):s.vt)+'</span></li>'}).join('')+'</ul>'}
function renderBoard(){const s=t();const inPick=state.phase==='pick';let grid='';for(let i=0;i<26;i++){const opened=state.opened[i],mine=state.playerCase===i;const dis=opened||mine||(!inPick&&state.toOpen<=0);grid+='<button class="case '+(opened?'opened':'')+(mine?' mine':'')+'" data-slot="'+i+'" '+(dis?'disabled':'')+' aria-label="Case '+(i+1)+(mine?', '+esc(s.yourCase):'')+(opened?', '+esc(prizeLabel(opened)):'')+'"><span class="handle"></span><span class="body"><span class="num">'+(i+1)+'</span><span class="val">'+(opened?esc(prizeLabel(opened)):'')+'</span></span>'+(mine?'<span class="marker">'+esc(s.yourCase)+'</span>':'')+'</button>'}
$('#screen').innerHTML=headerHtml()+'<div class="hud"><div class="hudbox"><small>'+esc(s.yourCase)+'</small><b>'+(state.playerCase===null?'—':'#'+(state.playerCase+1))+'</b></div><div class="hudbox"><small>'+esc(s.round)+'</small><b>'+(inPick?'—':(state.roundIdx+1))+'</b></div><div class="hudbox"><small>'+esc(s.toOpen)+'</small><b>'+(inPick?'—':state.toOpen)+'</b></div><div class="hudbox"><small>'+esc(s.banked)+'</small><b>'+state.banked+' '+esc(s.vt)+' \u00B7 '+Math.floor(state.banked/TOKENS_PER_GEN)+' '+esc(s.gensShort)+'</b></div><div class="hudbox"><small>'+esc(s.casesLeft)+'</small><b>'+unopenedAll()+' / 26</b></div></div><p class="hostline">'+esc(state.hostLine||(inPick?s.pickLine:pickLine(s.openLine)))+'</p>'+(state.error?'<p class="error" role="alert">'+esc(state.error)+'</p>':'')+'<div class="layout"><div class="grid">'+grid+'</div><aside class="board"><h3>'+esc(s.boardTitle)+'</h3>'+boardRowsHtml()+(state.commitmentHash?'<p class="note" style="word-break:break-all">'+esc(s.commitment)+': '+esc(state.commitmentHash.slice(0,24))+'…</p>':'')+'<div style="text-align:center">'+chipHtml()+'</div></aside></div>';
document.querySelectorAll('.case:not(:disabled)').forEach(b=>b.addEventListener('click',()=>onCase(Number(b.dataset.slot))))}
function openModal(html,kind=''){$('#modalRoot').innerHTML='<div class="modal-backdrop"><section class="modal '+kind+'" role="dialog" aria-modal="true">'+html+'</section></div>';previousFocus=document.activeElement;const f=$('#modalRoot button');if(f)f.focus()}
function closeModal(){state.modal=null;$('#modalRoot').innerHTML='';if(previousFocus&&previousFocus.focus)previousFocus.focus()}
function joeHtml(line){const s=t();return '<div class="joe"><div class="avatar">J</div><div><strong style="color:var(--orange2)">'+esc(s.hostName)+'</strong><p>\u201C'+esc(line)+'\u201D</p></div></div>'}
function renderModal(){const s=t();
if(state.modal==='reveal'){const d=state.modalData,p=d.prize;const line=p.type==='boost'?pickLine(s.joeBoost):(p.vt>=150?pickLine(s.joeBig):pickLine(s.joeSmall));openModal('<div class="kicker">'+esc(s.revealed)+' '+(d.slot+1)+'</div><div class="bigcase">'+(d.slot+1)+'</div><p>'+(p.type==='boost'?esc(s.wasBoost):esc(s.wasVt))+'</p><div class="offer-value">'+esc(prizeLabel(p))+'</div>'+joeHtml(line)+'<div class="modal-actions"><button id="cont" class="primary">'+esc(s.keepGoing)+'</button></div>');$('#cont').addEventListener('click',afterReveal)}
if(state.modal==='banker'){const offer=state.pendingOffer||{tokensValue:0,gens:0};openModal('<div class="kicker">'+esc(s.bankerCalling)+'</div><h2>'+esc(s.offerLabel)+'</h2>'+joeHtml(pickLine(s.joeBanker))+'<div class="offer-value"><small>'+esc(s.offerLabel)+'</small>'+offer.tokensValue+' '+esc(s.vt)+'<small>≈ '+offer.gens+' '+esc(s.freeGens)+'</small></div><span class="demochip">'+esc(s.illustrative)+'</span><div class="modal-actions"><button id="take" class="dealbtn take">'+esc(s.takeBtn)+'<small>'+esc(s.takeSub)+'</small></button><button id="keep" class="dealbtn keep">'+esc(s.keepBtn)+'<small>'+esc(s.keepSub)+'</small></button></div>','offer');$('#take').addEventListener('click',()=>decide(true));$('#keep').addEventListener('click',()=>decide(false))}
if(state.modal==='swap'){openModal('<div class="kicker">'+esc(s.swapTitle)+'</div><h2>'+esc(s.swapTitle)+'</h2><p>'+esc(s.swapText)+'</p>'+joeHtml(pickLine(s.joeKeep.concat(s.joeSwap)))+'<div class="modal-actions"><button id="keepMine" class="primary">'+esc(s.keepMine)+'</button><button id="doSwap" class="secondary">'+esc(s.swap)+'</button></div>');$('#keepMine').addEventListener('click',()=>finishGame(false));$('#doSwap').addEventListener('click',()=>finishGame(true))}}
function twistHtml(){const s=t();return '<div class="twist"><p class="note" style="font-size:1rem;color:#efe6d8">'+esc(s.twist0)+'</p><div class="t1">'+esc(s.twist1)+'</div><div class="t2">'+esc(s.twist2)+'</div><p class="note" style="font-size:.95rem;color:#efe6d8;margin-top:10px">'+esc(s.twistPts)+'</p><div class="t3">'+esc(s.twist3)+'</div><a class="primary cta" href="'+esc(ctaHref())+'">'+esc(s.activate)+'</a><a class="seclink" href="'+esc(EXPERIMENT_URL)+'">'+esc(s.seeExp)+'</a></div>'}
function perksHtml(perks){if(!perks||!perks.length)return '';const s=t();const counts={};perks.forEach(p=>{counts[p.kind]=(counts[p.kind]||0)+1});const parts=Object.keys(counts).map(k=>esc(s['boost_'+k])+' ×'+counts[k]);return '<p class="note">'+esc(s.perksLine)+': '+parts.join(' · ')+'</p>'}
function renderResult(){const s=t(),r=state.result||{vt:0,gens:0,casePrize:null,outcome:'case'};const gens=r.gens!==undefined?r.gens:Math.floor((r.vt||0)/TOKENS_PER_GEN);const claimBlock=r.claimUrl?'<p class="note">'+esc(s.claimNote)+'</p><a class="primary cta" href="'+esc(r.claimUrl)+'">'+esc(s.claimBtn)+'</a>':(CONFIG.API_LIVE?'<p class="note">'+esc(s.noClaimNote)+'</p>':'<p class="note">'+esc(s.demoNote)+'</p><span class="demochip">'+esc(s.demoChip)+'</span>');
$('#screen').innerHTML=headerHtml()+'<section class="card" style="text-align:center"><div class="kicker">'+esc(r.outcome==='deal'?s.dealTitle:s.finalTitle)+'</div>'+(r.outcome==='deal'?'<p>'+esc(s.dealText)+'</p>'+joeHtml(pickLine(s.joeDeal))+'<p>'+esc(s.finalTitle)+': <strong>'+esc(r.casePrize?prizeLabel(r.casePrize):'—')+'</strong></p>':'<div class="bigcase" style="font-size:2.6rem;font-weight:900;color:var(--orange2)">'+esc(r.casePrize?prizeLabel(r.casePrize):'—')+'</div>')+'<div class="totals"><div class="total"><small>'+esc(s.youLeave)+'</small><b>'+(r.vt||0)+' '+esc(s.vt)+'</b></div><div class="total"><small>'+esc(s.gensWorth)+'</small><b>'+gens+'</b></div></div><p class="note">'+esc(s.conversion)+'</p>'+perksHtml(r.perks)+claimBlock+twistHtml()+'<button id="again" class="secondary" style="margin-top:16px">'+esc(s.playAgain)+'</button></section>';
$('#again').addEventListener('click',()=>{clearSave();Object.assign(state,{phase:'welcome',tiles:[],assignments:[],opened:{},playerCase:null,roundIdx:0,toOpen:0,banked:0,perks:[],pendingOffer:null,offersMade:0,result:null,modal:null,error:'',hostLine:'',sessionId:null,commitmentHash:''});render()})}
/* ── Flow ── */
async function startGame(){ensureAudio();clickSound();state.error='';try{const res=await GameAPI.session();state.sessionId=res.sessionId;state.commitmentHash=res.commitmentHash||'';if(CONFIG.API_LIVE){state.tiles=(res.boardTiles||[]).map(p=>({type:p.type,vt:p.vt,kind:p.kind||null}));state.assignments=[];state.opened={};state.banked=0;state.perks=[];state.pendingOffer=null}state.phase='pick';state.hostLine=t().pickLine;save();render()}catch(e){state.error='The stage could not be reached. Check your connection and try again.';render()}}
async function onCase(slot){ensureAudio();clickSound();if(state.phase==='pick'){state.playerCase=slot;state.phase='open';state.roundIdx=0;state.toOpen=quotaFor(0);state.hostLine=pickLine(t().openLine);save();render();return}
if(state.phase!=='open'||state.toOpen<=0||state.opened[slot]!==undefined||slot===state.playerCase)return;
try{const x=await GameAPI.pick(slot);state.opened[slot]=x.prize;state.banked=x.bankedTokens;if(x.perks)state.perks=x.perks;state.pendingOffer=x.offer||null;state.toOpen--;state.modalData=x;state.modal='reveal';save();render();revealSound(x.prize)}catch(e){state.error='The case could not be opened. Try again.';render()}}
function advanceRound(){state.roundIdx++;state.toOpen=Math.min(quotaFor(state.roundIdx),Math.max(1,unopenedOthers()-1));state.hostLine=pickLine(t().openLine);state.phase='open'}
function afterReveal(){closeModal();state.modalData=null;
if(state.pendingOffer){state.phase='banker';state.modal='banker';save();render();ring();offerSound();return}
if(unopenedOthers()>1){advanceRound();save();render();return}
state.phase='swap';state.modal='swap';save();render()}
async function decide(take){ensureAudio();clickSound();try{const res=await GameAPI.decide(take);state.offersMade++;closeModal();state.pendingOffer=null;
if(take){state.result=res;state.phase='result';save();render();return}
state.hostLine=pickLine(t().joeNoDeal);advanceRound();save();render()}catch(e){state.error='The Banker lost the line. Try again.';render()}}
async function finishGame(swapped){ensureAudio();clickSound();try{const res=await GameAPI.finish(swapped);closeModal();state.result=res;state.phase='result';save();render();revealSound(res.casePrize||{type:'vt',vt:0})}catch(e){state.error='The final case jammed. Try again.';render()}}
/* ── Startup ── */
$('#langEn').addEventListener('click',()=>{state.lang='en';localStorage.setItem(langKey,'en');render()});
$('#langJa').addEventListener('click',()=>{state.lang='ja';localStorage.setItem(langKey,'ja');render()});
$('#muteBtn').addEventListener('click',()=>{ensureAudio();toggleMute()});
restore();render();
</script>
